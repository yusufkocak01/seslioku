<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesli Okuma</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
        }

        .audio-player-box {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background-color: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
        }

        .audio-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .audio-btn:hover { background-color: #1d4ed8; }
        .audio-btn:active { transform: scale(0.98); }
        .audio-btn.secondary { background-color: #64748b; }
        .audio-btn.secondary:hover { background-color: #475569; }

        .audio-status {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }

        .no-text-warning {
            font-size: 13px;
            color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="audio-player-box">
        <button id="btn-play-pause" class="audio-btn" disabled style="opacity: 0.5; cursor: not-allowed;">
            <svg id="play-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
            </svg>
            <span id="btn-text">Haber Çekiliyor...</span>
        </button>

        <button id="btn-stop" class="audio-btn secondary" style="display: none;">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5z"/>
            </svg>
            Durdur
        </button>

        <span id="audio-status" class="audio-status"></span>
    </div>

    <script>
        let fullText = "";
        let synth = window.speechSynthesis;
        let utterance = null;

        const playIcon = '<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>';
        const pauseIcon = '<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>';

        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnStop = document.getElementById('btn-stop');
        const statusText = document.getElementById('audio-status');

        if (!('speechSynthesis' in window)) {
            statusText.innerHTML = '<span class="no-text-warning">Tarayıcınız sesli okumayı desteklemiyor.</span>';
        }

        // 1. URL PARAMETRESİNDEN HABER LİNKİNİ AL
        const urlParams = new URLSearchParams(window.location.search);
        const haberUrl = urlParams.get('url');

        // 2. HABER LİNKİNE ARKA PLANDA BAĞLAN VE METNİ ÇEK
        if (haberUrl) {
            fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(haberUrl))
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Ağ yanıtı hatalı.');
                })
                .then(data => {
                    // HTML içeriğini ayrıştır
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    // Sizin sitenizin yapısına göre başlık ve metni bul
                    const baslik = doc.querySelector('h1') ? doc.querySelector('h1').innerText : '';
                    const detayDiv = doc.querySelector('.detay') || doc.querySelector('[property="articleBody"]');
                    
                    if (detayDiv) {
                        // Sadece düz metni al, HTML etiketlerinden temizle
                        const metin = detayDiv.innerText;
                        fullText = (baslik + '. ' + metin).trim();
                        
                        if (fullText.length > 10) {
                            btnPlayPause.disabled = false;
                            btnPlayPause.style.opacity = '1';
                            btnPlayPause.style.cursor = 'pointer';
                            btnPlayPause.innerHTML = playIcon + ' <span id="btn-text">Haberi Dinle</span>';
                        } else {
                            statusText.innerHTML = '<span class="no-text-warning">Haber metni bulunamadı.</span>';
                        }
                    } else {
                        statusText.innerHTML = '<span class="no-text-warning">Haber yapısı okunamadı.</span>';
                    }
                })
                .catch(error => {
                    console.error('Haber çekme hatası:', error);
                    statusText.innerHTML = '<span class="no-text-warning">İçerik yüklenirken hata oluştu.</span>';
                });
        } else {
            statusText.innerHTML = '<span class="no-text-warning">Haber adresi alınamadı.</span>';
        }

        // 3. OYNATMA İŞLEVLERİ
        btnPlayPause.addEventListener('click', function () {
            if (!fullText) return;

            if (synth.paused) {
                synth.resume();
                btnPlayPause.innerHTML = pauseIcon + ' <span>Duraklat</span>';
                statusText.innerText = 'Okunuyor...';
                return;
            }

            if (synth.speaking) {
                synth.pause();
                btnPlayPause.innerHTML = playIcon + ' <span>Devam Et</span>';
                statusText.innerText = 'Duraklatıldı';
                return;
            }

            utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.3;
            utterance.pitch = 1.0;

            const voices = synth.getVoices();
            const trVoice = voices.find(function (v) { return v.lang.includes('tr'); });
            if (trVoice) utterance.voice = trVoice;

            utterance.onstart = function () {
                btnPlayPause.innerHTML = pauseIcon + ' <span>Duraklat</span>';
                btnStop.style.display = 'inline-flex';
                statusText.innerText = 'Okunuyor...';
            };

            utterance.onend = function () { resetUI(); };
            utterance.onerror = function () { resetUI(); };

            synth.speak(utterance);
        });

        btnStop.addEventListener('click', function () {
            synth.cancel();
            resetUI();
        });

        function resetUI() {
            btnPlayPause.innerHTML = playIcon + ' <span id="btn-text">Haberi Dinle</span>';
            btnStop.style.display = 'none';
            statusText.innerText = '';
        }

        window.addEventListener('beforeunload', function () {
            synth.cancel();
        });
    </script>
</body>
</html>
